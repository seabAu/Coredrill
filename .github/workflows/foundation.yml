name: Foundation CI

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-and-policy:
    name: Build, static checks, tests, and policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0
          node --version
          pnpm --version

      - name: Install pinned Rust and RustSec audit tool
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          cargo install cargo-audit --version 0.22.2 --locked
          rustc --version
          cargo --version
          cargo audit --version

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run foundation gate
        run: pnpm verify

      - name: Emit reviewed license inventory
        run: pnpm report:licenses > dependency-licenses.json

      - name: Emit reviewed Rust license inventory
        run: pnpm report:licenses:rust > dependency-licenses-rust.json

  native-storage-windows:
    name: Native storage and Tauri shell / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0
          node --version
          pnpm --version

      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustc --version
          cargo --version

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Prove native SQLite contracts
        run: pnpm test:storage-native

      - name: Prove Tauri app-data resolution
        run: pnpm --filter @coredrill/desktop test:platform

      - name: Prove redacted OS secure storage
        run: pnpm test:secure-storage

      - name: Prove picker-owned native archive recovery
        run: pnpm test:native-archive

      - name: Lint complete Tauri boundary
        run: pnpm --filter @coredrill/desktop lint:desktop

      - name: Build installable Tauri package
        run: pnpm --filter @coredrill/desktop build:installer:windows

      - name: Prove installed startup and resources
        shell: pwsh
        run: >-
          ./tooling/scripts/run-native-package-proof.ps1
          -OutputPath "$env:RUNNER_TEMP/coredrill-native-package-proof.json"

      - name: Upload immutable Windows package proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coredrill-windows-nsis-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ runner.temp }}/coredrill-native-package-proof.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  browser-storage-chrome:
    name: Browser storage / Chrome ${{ matrix.chrome }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        chrome: ["152.0.7977.54", "151.0.7922.138"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install exact Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: ${{ matrix.chrome }}

      - name: Prove SQLite/OPFS lifecycle
        env:
          COREDRILL_BROWSER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
          COREDRILL_EXPECTED_BROWSER_VERSION: ${{ matrix.chrome }}
          COREDRILL_TEST_MATCH: storage-browser.spec.mjs
        run: pnpm test:storage-browser

  browser-storage-firefox:
    name: Browser storage / Firefox ${{ matrix.firefox }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        firefox: ["154.0", "153.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.22.0

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install exact Firefox
        id: firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        with:
          firefox-version: ${{ matrix.firefox }}

      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@eb8b0670366f719ca31703766a8cb7e3ea2c56ed # v0.0.0
        with:
          geckodriver-version: "0.37.1"

      - name: Prove SQLite/OPFS lifecycle
        env:
          COREDRILL_EXPECTED_BROWSER_VERSION: ${{ matrix.firefox }}
          COREDRILL_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}
        run: pnpm test:storage-firefox-webdriver

  secret-history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan with checksum-pinned Gitleaks CLI image
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose .

  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
