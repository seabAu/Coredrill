[package]
name = "coredrill-desktop"
version = "0.0.0"
description = "Coredrill's thin Tauri desktop boundary"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
build = "build.rs"
default-run = "coredrill"

[lib]
name = "coredrill_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "coredrill"
path = "src/main.rs"
required-features = ["desktop-shell"]

[[bin]]
name = "coredrill-native-storage-probe"
path = "src/bin/native-storage-probe.rs"
required-features = ["native-storage-probe"]

[features]
default = ["desktop-shell"]
desktop-shell = ["dep:tauri", "dep:tauri-plugin-dialog"]
native-storage-probe = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
keyring-core = "=1.0.0"
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.11.0", default-features = false }
tauri = { version = "=2.11.3", optional = true, default-features = false, features = ["wry"] }
tauri-plugin-dialog = { version = "=2.7.1", optional = true }
zeroize = "=1.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tauri = { version = "=2.11.3", default-features = false, features = ["test", "wry"] }
