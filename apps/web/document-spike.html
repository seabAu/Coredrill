<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coredrill document editor verification</title>
    <style>
      :root {
        color: #152638;
        background: #f4f7fa;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 54rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #editor {
        min-height: 18rem;
        padding: 1.25rem;
        border: 2px solid #47647d;
        border-radius: 0.5rem;
        background: white;
      }
      #editor:focus-within {
        outline: 3px solid #2b77c0;
        outline-offset: 3px;
      }
      .tiptap {
        min-height: 16rem;
        outline: none;
        white-space: pre-wrap;
      }
      #print-preview {
        display: none;
      }
      #status {
        min-height: 1.5rem;
      }
      @media print {
        @page {
          size: letter;
          margin: 0.65in 0.7in;
        }
        html,
        body,
        #print-preview,
        .coredrill-print-document {
          color: #172b3a;
          background: white !important;
        }
        body {
          font:
            10.5pt/1.3 Arial,
            sans-serif;
        }
        body > main {
          display: none;
        }
        #print-preview {
          display: block;
        }
        #print-preview h1 {
          margin: 0 0 0.12in;
          color: #12344d;
          font-size: 20pt;
        }
        #print-preview h2 {
          break-after: avoid;
          margin: 0.16in 0 0.06in;
          color: #145da0;
          font-size: 13pt;
        }
        #print-preview h3 {
          break-after: avoid;
          margin: 0.12in 0 0.04in;
          color: #145da0;
          font-size: 11pt;
        }
        #print-preview p,
        #print-preview li {
          orphans: 2;
          widows: 2;
        }
        #print-preview p {
          margin: 0 0 0.07in;
        }
        #print-preview ul,
        #print-preview ol {
          margin: 0.04in 0 0.08in 0.28in;
          padding: 0;
        }
        #print-preview a {
          color: #145da0;
          text-decoration: underline;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coredrill document editor verification</h1>
      <p id="status" role="status">Document harness ready</p>
      <p id="editor-help">
        Edit document content. Standard keyboard shortcuts provide undo, redo, headings, lists,
        bold, italic, and links.
      </p>
      <section id="editor" aria-label="Document editor"></section>
    </main>
    <section id="print-preview" aria-label="PDF print preview"></section>
    <script type="module" src="/src/document-spike.ts"></script>
  </body>
</html>
